services:

  mongo:
    image: mongo:7
    container_name: online-exam-mongo
    restart: unless-stopped

    volumes:
      - online-exam-mongo-data:/data/db

    networks:
      - online-exam-network

  backend:
    image: ${BACKEND_IMAGE}

    container_name: online-exam-backend
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/online-exam-system
      JWT_SECRET: ${JWT_SECRET}

    ports:
      - "5000:5000"

    depends_on:
      - mongo

    networks:
      - online-exam-network

  frontend:
    image: ${FRONTEND_IMAGE}

    container_name: online-exam-frontend
    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      - backend

    networks:
      - online-exam-network


networks:

  online-exam-network:
    driver: bridge


volumes:

  online-exam-mongo-data: