services:

  mongo:
    image: mongo:7
    container_name: online-exam-mongo
    restart: unless-stopped

    ports:
      - "27017:27017"

    volumes:
      - mongo-data:/data/db

    networks:
      - online-exam-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: online-exam-backend

    restart: unless-stopped

    ports:
      - "5000:5000"

    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/online-exam-system

    depends_on:
      - mongo

    networks:
      - online-exam-network

networks:
  online-exam-network:
    driver: bridge

volumes:
  mongo-data:
