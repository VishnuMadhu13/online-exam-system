services:

  mongo:
    image: mongo:7
    container_name: online-exam-mongo-test

  backend:
    image: ${BACKEND_IMAGE}
    container_name: online-exam-backend-test

    environment:
      NODE_ENV: test
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/online-exam-system-test
      JWT_SECRET: test-secret

    ports:
      - "5001:5000"

    depends_on:
      - mongo

  frontend:
    image: ${FRONTEND_IMAGE}
    container_name: online-exam-frontend-test

    ports:
      - "8080:80"

    depends_on:
      - backend