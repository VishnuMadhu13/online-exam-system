services:

  mongo:
    image: mongo:7

  backend:
    image: ${BACKEND_IMAGE}
    environment:
      NODE_ENV: test
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/online-exam-system-test
      JWT_SECRET: test-secret
    ports:
      - "5001:5000"
    depends_on:
      - mongo

  frontend:
    image: ${FRONTEND_IMAGE}
    ports:
      - "8081:80"
    depends_on:
      - backend